spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/busTrackingSystem?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway Database Migrations (baseline-version=0 ensures V1/V2/V3 run safely on existing non-empty databases)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Initial Admin Bootstrap (provisioned via environment variable when no admin exists in DB)
app.initial-admin.id=${APP_INITIAL_ADMIN_ID:10001}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:}

# WebSocket Allowed Origins (explicit origins only; wildcards are rejected)
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Session & Cookie Configuration
server.servlet.session.timeout=4h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Road Routing Configuration (OSRM / Custom Routing Server)
routing.osrm.base-url=${ROUTING_OSRM_BASE_URL:https://router.project-osrm.org}
routing.osrm.profile=driving

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security=INFO
spring.output.ansi.enabled=always

