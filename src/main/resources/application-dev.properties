# Development profile: schema changes are managed by Flyway, not Hibernate auto-update.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Run the same versioned migrations in development and production by default.
# Set FLYWAY_ENABLED=false only for a deliberate local troubleshooting session.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
